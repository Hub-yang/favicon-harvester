# 扩展元信息：manifest 通过 __MSG_extName__ / __MSG_extDescription__ 引用
# ⚠️ extName 必须逐字保持「图标提取器」——Chrome 网上应用店已上架版本用的就是它，改动会让已装用户看到的扩展名变化
extName: 图标提取器
extDescription: 扫描当前网站正在使用的图标（favicon 等），去重后列出全部结果，单个下载或打包成一个 ZIP 拿走，不依赖第三方服务。

app:
  title: 图标提取器

status:
  loading: 正在扫描当前页面的图标…
  restricted: 当前页面受限，仅显示浏览器兜底图标

retry:
  noResults: 未能获取到可展示的图标
  empty: 当前网站暂无可获取的图标
  retrying: 重试中…
  retry: 重试

autoScan:
  title: 自动扫描和数量徽章
  description: 授权后，扩展会自动扫描当前网页并显示可用图标数量。它只在本机保存开关，你可以随时停用。
  toolbarHint: 将扩展固定到 Chrome 工具栏，就能在地址栏旁看到数量徽章。
  settings: 自动扫描设置
  enable: 授权并启用
  disable: 停用自动扫描
  later: 稍后
  denied: 未获得站点访问权限，仍可手动扫描。
  saveFailed: 无法读取或保存设置。请重新打开设置页再试。
  revokeFailed: 自动扫描已停用，但未能撤回站点权限。可在 Chrome 扩展管理中调整站点访问。
  noSiteAccess: Chrome 当前未授权任何站点。重新授权后才能自动扫描。
  partialBadge: 至少验证了 $1 个图标，打开面板查看完整结果。

toolbar:
  rescan: 重新扫描
  # 中文无复数变化，但两支都要写，否则与 en 的 key 结构对不齐
  iconCount:
    1: 1 个图标
    n: $1 个图标
  downloadZip: 打包下载 ZIP
  zipping: 打包中…
  done: 已下载
  doneSkipped: 已下载，跳过 $1 个
  zipFailed: 打包失败，重试

card:
  sourceTab: 浏览器兜底
  unknownSize: 尺寸未知
  download: 下载
  downloading: 下载中…
  downloaded: 已下载
  retry: 重试
  copy: 复制
  copyUrl: 链接
  copyImage: 图片
  copyDataUri: Data URI
  copyLinkTag: <link>
  copyImageOnlyPng: 系统剪贴板只接受 PNG 格式的图片
  preview: 预览
  previewBg: 切换预览背景
  bgChecker: 棋盘格
  bgLight: 白底
  bgDark: 黑底
  copied: 已复制
  copyFailed: 失败

contextMenu:
  scanPage: 提取此页图标
