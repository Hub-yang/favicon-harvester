# Extension metadata: referenced from the manifest as __MSG_extName__ / __MSG_extDescription__
# Keep extDescription under 132 characters — that is Chrome's hard limit for manifest descriptions.
extName: Favicon Harvester
extDescription: Scan the icons a site actually uses, list every unique result, download them one by one or as one ZIP. No third-party services.

app:
  title: Favicon Harvester

status:
  loading: Scanning this page for icons…
  restricted: This page is restricted, showing the browser fallback icon only

retry:
  noResults: No displayable icons found
  empty: This site has no icons to offer
  retrying: Retrying…
  retry: Retry

autoScan:
  title: Automatic scanning and icon count
  description: After you grant access, the extension automatically scans the current page and shows how many icons are available. It only saves your on/off preference locally, and you can turn it off at any time.
  toolbarHint: Pin the extension to the Chrome toolbar to see its count next to the address bar.
  settings: Automatic scan settings
  enable: Grant access and enable
  disable: Turn off automatic scanning
  later: Later
  denied: Site access was not granted. You can still scan manually.
  saveFailed: Could not read or save the setting. Reopen this page and try again.
  revokeFailed: Automatic scanning is off, but site access could not be removed. You can change site access in Chrome's extension settings.
  noSiteAccess: Chrome has not granted access to any sites. Grant access again to resume automatic scanning.
  partialBadge: At least $1 icons verified. Open the panel for the full results.

toolbar:
  rescan: Rescan
  iconCount:
    1: 1 icon
    n: $1 icons
  downloadZip: Download ZIP
  zipping: Packaging…
  done: Downloaded
  doneSkipped: Downloaded, $1 skipped
  zipFailed: Packaging failed, retry

card:
  sourceTab: Browser fallback
  unknownSize: Size unknown
  download: Save
  downloading: Saving…
  downloaded: Saved
  retry: Retry
  copy: Copy
  copyUrl: Link
  copyImage: Image
  copyDataUri: Data URI
  copyLinkTag: <link>
  copyImageOnlyPng: The system clipboard only accepts PNG images
  preview: Preview
  previewBg: Toggle preview background
  bgChecker: Checker
  bgLight: Light
  bgDark: Dark
  copied: Copied
  copyFailed: Failed

contextMenu:
  scanPage: Harvest icons from this page
